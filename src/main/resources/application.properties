spring.application.name=ofertas

server.port:8081
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/OFERTA
spring.datasource.username=postgres
spring.datasource.password=ALFA2020
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.minimumIdle=10
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout: 30000
spring.datasource.hikari.maxLifetime=50000
spring.datasource.hikari.connectionTimeout: 35000
spring.datasource.hikari.leak-detectionThreshold: 3000

perfil.malo=malo
perfil.bueno=bueno
perfil.excelente=excelente
perfil.plus=plus

